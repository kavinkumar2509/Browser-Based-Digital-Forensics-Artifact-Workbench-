server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve assets directly; cache versioned Vite output aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router SPA fallback supports direct URLs and browser refreshes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
